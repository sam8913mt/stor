name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: Require and sanity-check Supabase repository secrets
        run: |
          test -n "$VITE_SUPABASE_URL" || { echo "::error::Secret VITE_SUPABASE_URL is not set (Settings → Secrets and variables → Actions)"; exit 1; }
          test -n "$VITE_SUPABASE_ANON_KEY" || { echo "::error::Secret VITE_SUPABASE_ANON_KEY is not set (Settings → Secrets and variables → Actions)"; exit 1; }
          url="$(printf '%s' "$VITE_SUPABASE_URL" | tr -d '[:space:]"'"'"'')"
          key="$(printf '%s' "$VITE_SUPABASE_ANON_KEY" | tr -d '[:space:]"'"'"'')"
          case "$url" in
            https://*.*) ;;
            *) echo "::warning::VITE_SUPABASE_URL should look like https://YOUR-REF.supabase.co (the app tolerates a missing https:// but check the value)." ;;
          esac
          if [ "${#key}" -lt 20 ]; then echo "::error::VITE_SUPABASE_ANON_KEY is too short to be an anon public key."; exit 1; fi
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-audit --no-fund
      # `npm run build` = `tsc --noEmit && vite build`: any type error or build error fails this job,
      # and the deploy job below never runs (it `needs` this job).
      - run: npm run build
      - name: Verify the production build output
        run: |
          test -f dist/index.html || { echo "::error::dist/index.html is missing — the build did not produce a site."; exit 1; }
          if grep -q '/src/main.tsx' dist/index.html; then echo "::error::dist/index.html still points at /src/main.tsx (not a production build)."; exit 1; fi
          ls dist/assets/*.js > /dev/null 2>&1 || { echo "::error::No JavaScript bundle in dist/assets."; exit 1; }
          echo "Build output looks correct: $(ls dist/assets | wc -l) asset files."
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
