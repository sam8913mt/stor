name: Deploy to GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-audit --no-fund
      - run: npm run build
      - name: Assemble site (clean URLs, SPA fallback, config)
        run: |
          mkdir dist
          cp -r index.html 404.html favicon.svg manifest.webmanifest sw.js icons assets admin dist/
          # Supabase values: repository secrets if set, otherwise the committed config.js
          if [ -n "$VITE_SUPABASE_URL" ] && [ -n "$VITE_SUPABASE_ANON_KEY" ]; then
            jq -rn --arg u "$VITE_SUPABASE_URL" --arg k "$VITE_SUPABASE_ANON_KEY" '"window.ARAM_CONFIG = " + ({SUPABASE_URL: $u, SUPABASE_ANON_KEY: $k} | tojson) + ";"' > dist/config.js
          else
            cp config.js dist/config.js
          fi
          echo 'window.ARAM_CONFIG.CLEAN_URLS = true;' >> dist/config.js
          # number of path segments that belong to the hosting folder: 0 for user sites (OWNER.github.io) and custom domains, else 1
          REPO="${GITHUB_REPOSITORY#*/}"; OWNER="${GITHUB_REPOSITORY%/*}"
          if [ -f CNAME ] || [ "${REPO,,}" = "${OWNER,,}.github.io" ]; then KEEP=0; else KEEP=1; fi
          [ -f CNAME ] && cp CNAME dist/CNAME || true
          sed -i "s/__KEEP__/$KEEP/" dist/404.html
          touch dist/.nojekyll
          # sitemap.xml + robots.txt (custom domain from CNAME, otherwise the github.io address)
          if [ -f CNAME ]; then export SITE_URL="https://$(head -n1 CNAME | tr -d '[:space:]')/"; elif [ "$KEEP" = "0" ]; then export SITE_URL="https://${REPO}/"; else export SITE_URL="https://${OWNER}.github.io/${REPO}/"; fi
          node scripts/sitemap.mjs dist || true
          test -f dist/assets/app.js
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
