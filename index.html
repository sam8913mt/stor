<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#F7F4EE" />
    <script>
      // GitHub Pages SPA fallback (see 404.html): turns /repo/?/shop&cat=a back into /repo/shop?cat=a before the app starts.
      (function (l) {
        if (l.search[1] === '/') {
          var d = l.search.slice(1).split('&').map(function (x) { return x.replace(/~and~/g, '&'); }).join('?');
          // relative URLs (assets/app.js, config.js) must keep resolving against the site folder after the address is rewritten
          document.write('<base href="' + l.pathname + '">');
          window.history.replaceState(null, null, l.pathname.slice(0, -1) + d + l.hash);
        }
      })(window.location);
    </script>
    <title>ARAM</title>
    <meta name="description" content="ARAM — quiet luxury fashion." />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="stylesheet" href="assets/app.css" />
    <!-- Fonts are optional: if Google Fonts is slow or blocked the site still renders with system fonts. -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500&family=Vazirmatn:wght@200;300;400;500;600&display=swap" media="print" onload="this.media='all'" />
  </head>
  <body>
    <div id="root"></div>
    <noscript>This store needs JavaScript enabled. / برای نمایش فروشگاه باید جاوااسکریپت فعال باشد.</noscript>
    <script src="config.js"></script>
    <script src="assets/app.js"></script>
  </body>
</html>
